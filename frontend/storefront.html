<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aster Store — Demo Checkout</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0F14; --panel:#121820; --panel-2:#171F29; --border:#232C38;
    --text:#E7ECF0; --text-dim:#8996A6; --gold:#D4A24C;
  }
  *{box-sizing:border-box;}
  body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;margin:0;padding:32px 20px;}
  .shell{max-width:720px;margin:0 auto;}
  h1{font-family:'Space Grotesk';font-size:22px;margin-bottom:4px;}
  .sub{color:var(--text-dim);font-size:13px;margin-bottom:28px;}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:32px;}
  .product-card{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;
    cursor:pointer;transition:border-color .15s;
  }
  .product-card:hover{border-color:var(--gold);}
  .product-card.selected{border-color:var(--gold);background:var(--panel-2);}
  .product-name{font-weight:600;margin-bottom:4px;}
  .product-price{color:var(--gold);font-family:'Space Grotesk';font-weight:600;font-size:18px;}
  .product-desc{color:var(--text-dim);font-size:12.5px;margin-top:6px;line-height:1.4;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  .field input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;
    color:var(--text);font-size:14px;padding:9px 12px;
  }
  .field input:focus{outline:none;border-color:var(--gold);}
  button.pay{
    width:100%;background:var(--gold);color:#100b02;border:none;border-radius:8px;
    font-weight:600;font-size:15px;padding:13px;cursor:pointer;margin-top:8px;
  }
  button.pay:disabled{opacity:0.5;cursor:not-allowed;}
  .status{margin-top:16px;font-size:13px;color:var(--text-dim);}
  .status.error{color:#E5595E;}
  .status.success{color:#2FD4A7;}
</style>
</head>
<body>
<div class="shell">
  <h1>Aster Store — Demo Checkout</h1>
  <div class="sub">Test-mode purchases only. Pick a product to trigger a real Razorpay test order.</div>

  <div class="products" id="products"></div>

  <div class="field"><label>Name</label><input type="text" id="custName" placeholder="Jane Doe" /></div>
  <div class="field"><label>Email</label><input type="email" id="custEmail" placeholder="jane@example.com" /></div>
  <div class="field"><label>Phone</label><input type="text" id="custContact" placeholder="9999999999" /></div>

  <button class="pay" id="payBtn" disabled>Select a product first</button>
  <div class="status" id="status"></div>
</div>

<script>
  // Point this at your deployed backend, e.g. "https://upsell-agent-xxxx.onrender.com"
  const API_BASE = window.UPSELL_API_BASE || "https://upsell-agent-cjua.onrender.com";

  const PRODUCTS = [
    {id: "phone-x1", name: "Aster Phone X1", price: "Rs 24,999.00", desc: "Flagship smartphone, 128GB, triple camera."},
    {id: "laptop-air", name: "Aster Laptop Air", price: "Rs 54,999.00", desc: "Lightweight 14-inch laptop, 16GB RAM."},
    {id: "watch-fit", name: "Aster Watch Fit", price: "Rs 7,999.00", desc: "Fitness smartwatch with heart-rate tracking."},
  ];

  let selectedProductId = null;

  function renderProducts(){
    const container = document.getElementById("products");
    container.innerHTML = PRODUCTS.map(p => `
      <div class="product-card" data-id="${p.id}">
        <div class="product-name">${p.name}</div>
        <div class="product-price">${p.price}</div>
        <div class="product-desc">${p.desc}</div>
      </div>
    `).join("");
    container.querySelectorAll(".product-card").forEach(card => {
      card.addEventListener("click", () => {
        container.querySelectorAll(".product-card").forEach(c => c.classList.remove("selected"));
        card.classList.add("selected");
        selectedProductId = card.dataset.id;
        const btn = document.getElementById("payBtn");
        btn.disabled = false;
        btn.textContent = `Pay for ${PRODUCTS.find(p => p.id === selectedProductId).name}`;
      });
    });
  }
  renderProducts();

  document.getElementById("payBtn").addEventListener("click", async () => {
    const statusEl = document.getElementById("status");
    statusEl.className = "status";
    statusEl.textContent = "Creating order...";

    const body = {
      product_id: selectedProductId,
      customer_name: document.getElementById("custName").value || undefined,
      customer_email: document.getElementById("custEmail").value || undefined,
      customer_contact: document.getElementById("custContact").value || undefined,
    };

    try {
      const res = await fetch(API_BASE + "/checkout/create-order", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error("Order creation failed: " + res.status);
      const order = await res.json();

      statusEl.textContent = "Opening Razorpay checkout...";

      const options = {
        key: order.razorpay_key_id,
        amount: order.amount_paise,
        currency: order.currency,
        name: "Aster Store (Test Mode)",
        description: order.product_name,
        order_id: order.razorpay_order_id,
        handler: function(response){
          statusEl.className = "status success";
          statusEl.textContent = "Payment successful! Payment ID: " + response.razorpay_payment_id +
            ". Check the merchant dashboard for the upsell offer that gets triggered.";
        },
        prefill: {
          name: body.customer_name || "",
          email: body.customer_email || "",
          contact: body.customer_contact || "",
        },
        theme: { color: "#D4A24C" },
        modal: {
          ondismiss: function(){
            statusEl.className = "status";
            statusEl.textContent = "Checkout closed without completing payment.";
          }
        }
      };

      const rzp = new Razorpay(options);
      rzp.on('payment.failed', function(response){
        statusEl.className = "status error";
        statusEl.textContent = "Payment failed: " + response.error.description;
      });
      rzp.open();

    } catch (err) {
      statusEl.className = "status error";
      statusEl.textContent = "Error: " + err.message;
    }
  });
</script>
</body>
</html>
